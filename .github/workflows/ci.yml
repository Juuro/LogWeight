name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: Core unit tests (swift test)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: swift test
        working-directory: Packages/LogWeightCore
        run: swift test --parallel

  asc-tool-tests:
    name: Release tool tests (Tools/asc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: unittest (no network, no secrets)
        working-directory: Tools
        run: python3 -m unittest discover -s asc/tests -t .

  ios-build:
    name: iOS build + UI smoke
    # macos-14 + latest-stable matches the ~8m baseline (iPad 10th gen, preinstalled simulators).
    runs-on: macos-14
    needs: core-tests
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/.ci/DerivedData
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apple CI setup
        uses: ./.github/actions/apple-ci-setup
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}

      - name: Ensure iOS simulator platform
        run: bash .github/scripts/ensure-simulator-platform.sh iOS LogWeight

      # LogWeight embeds the Watch app; build-for-testing needs watchOS simulators when absent.
      - name: Ensure watchOS simulator platform
        run: bash .github/scripts/ensure-simulator-platform.sh watchOS LogWeight

      - name: Resolve iOS simulator
        id: sim
        run: |
          UDID=$(python3 .github/scripts/resolve-ios-simulator-udid.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Single test action (matches pre-optimization CI lifecycle; avoids simulator flakes from
      # test-without-building). DerivedData cache still speeds up compile on warm runs.
      # All 13 EntryViewSmokeTests run on every branch. To run a PR subset later, add
      # repeated -only-testing:LogWeightUITests/EntryViewSmokeTests/testMethodName flags.
      - name: Build and run UI smoke tests
        run: |
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b || true
          xcodebuild test \
            -project LogWeight.xcodeproj \
            -scheme LogWeight \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO

  watch-build:
    name: watchOS build (LogWeightWatch scheme)
    runs-on: macos-14
    needs: core-tests
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/.ci/DerivedData
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apple CI setup
        uses: ./.github/actions/apple-ci-setup
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}

      - name: Ensure watchOS simulator platform
        run: bash .github/scripts/ensure-simulator-platform.sh watchOS LogWeightWatch

      - name: Build for watchOS Simulator
        run: |
          xcodebuild build \
            -project LogWeight.xcodeproj \
            -scheme LogWeightWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO
